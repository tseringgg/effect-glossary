<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sector Map</title>
<style>
  :root { --bg:#fff; --fg:#111; --mut:#666; --line:#d4d4d4; --panel:#f6f6f6;
          --neutral:#9a9a96; --warn:#b3261e; --warnbg:#fff4e5; --warnline:#e09b3d; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0 0 84px; font:13px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;
         background:var(--bg); color:var(--fg); }
  header { background:var(--panel); border-bottom:2px solid var(--line); padding:8px 12px; }
  h1 { font-size:14px; margin:0 0 4px; }
  .note { font-size:11px; color:var(--mut); }
  .caveat { background:var(--warnbg); border:1px solid var(--warnline);
            border-left:4px solid var(--warnline); padding:6px 9px; margin:6px 0 0;
            font-size:12px; }
  #wrap { padding:10px 12px; }
  #plot { border:1px solid var(--line); background:#fcfcfc; }

  /* Regions default to NEUTRAL, not to eight hues. Measured reason: up to 7
     sectors stack at a single point and only 32.6% of covered area carries
     just one, so simultaneous hue display cannot be legible. Hue appears only
     for the sector(s) under the cursor, and the readout panel -- not the
     colour -- is the authoritative answer. */
  /* Region outlines are HIDDEN by default -- the constellation lines, the
     coloured dots and the labels carry the map. An outline appears only for
     the sector whose legend button is hovered or pinned. */
  .sect path { fill:var(--hue); stroke:var(--hue);
               fill-opacity:0; stroke-opacity:0; stroke-width:1.2;
               transition:fill-opacity .12s, stroke-opacity .12s; }
  .sect text { font:bold 12px ui-monospace,monospace; paint-order:stroke;
               stroke:#fff; stroke-width:3.5px; stroke-linejoin:round;
               fill:var(--hue); opacity:1; }
  .sect.hot path { fill-opacity:.20; stroke-opacity:1; stroke-width:2.4; }
  .sect.mute path { fill-opacity:0; stroke-opacity:0; }
  .sect.mute text { opacity:.10; }

  /* constellation: MST edges within each sector */
  .link { stroke:var(--hue); stroke-opacity:.30; stroke-width:.9; fill:none; }
  .lg-edges.hot .link { stroke-opacity:.95; stroke-width:1.7; }
  .lg-edges.mute .link { stroke-opacity:.05; }

  circle.leaf { stroke:#fff; stroke-width:.7; cursor:pointer; }
  circle.leaf:hover { stroke:#111; stroke-width:1.9; }
  /* Muted dots stop being hoverable/clickable, not just dim. Left alone, a
     faded-out dot could still sit on top of (or right next to) a highlighted
     one and steal its tooltip -- exactly when you're trying to pick out the
     highlighted leaf, which is the moment it matters most. */
  circle.leaf.mute { opacity:.12; pointer-events:none; }
  circle.stray { stroke-width:1.7; fill-opacity:.3; }

  #legend { display:flex; flex-wrap:wrap; gap:7px; margin:8px 0 0; align-items:flex-start; }
  .lg { border:2px solid var(--line); background:#fff; font-size:11px; width:230px; }
  .lg .sw { display:inline-block; width:10px; height:10px; border-radius:2px;
            margin-right:5px; vertical-align:-1px; flex:0 0 auto; }
  .lg small { display:block; font-size:10px; color:var(--mut); }
  .lg-head.on { background:#111; color:#fff; border-color:#111; }
  .lg-head.on small { color:#ddd; }
  /* the sector header is a real <button> so click/keyboard semantics stay
     native; the checkboxes below it are siblings, never nested inside it */
  .lg-head { all:unset; box-sizing:border-box; display:block; width:100%;
             padding:3px 8px; cursor:pointer; font:inherit; font-size:11px;
             text-align:left; line-height:1.3; }
  .lg-head:hover, .lg-head:focus { background:var(--panel); }
  .lg-head .chev { float:right; color:var(--mut); font-size:9px;
                   transition:transform .12s; }
  .lg.open .lg-head .chev { transform:rotate(90deg); }
  .lg.has-selected .lg-head { border-left:4px solid var(--hue); }
  .lg-plain { border:2px solid var(--line); background:#fff; padding:3px 8px;
              cursor:pointer; font:inherit; font-size:11px; text-align:left;
              line-height:1.3; width:230px; }
  .lg-plain.on { background:#111; color:#fff; border-color:#111; }
  .lg-plain.on small { color:#ddd; }
  .lg-branches { border-top:1px solid var(--line); max-height:230px; overflow-y:auto; }
  .br-row { display:flex; align-items:center; gap:6px; padding:3px 8px;
            cursor:pointer; font-size:10.5px; }
  .br-row:hover { background:var(--panel); }
  .br-row.checked { background:#eef4fb; }
  .br-row input { margin:0; flex:0 0 auto; }
  .br-name { flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .br-meta { color:var(--mut); font-size:9.5px; white-space:nowrap; flex:0 0 auto; }

  #tip { position:fixed; z-index:30; pointer-events:none; display:none;
         background:#111; color:#fff; font-size:11px; padding:6px 8px;
         border-radius:3px; max-width:430px; line-height:1.4; }
  #tip .lab { color:#9ecbff; word-break:break-all; display:block; margin:3px 0; }
  #tip .cards { color:#ddd; }
  #tip .none { color:#ffb3ab; }
  .chip { display:inline-block; font-size:10px; padding:1px 6px; margin:2px 4px 0 0;
          border-radius:2px; color:#fff; white-space:nowrap; }
  #here { position:fixed; left:0; right:0; bottom:0; z-index:25; background:#fff;
          border-top:2px solid var(--line); padding:6px 12px; font-size:11px;
          min-height:58px; }
  #here .empty { color:var(--mut); }
</style>
</head>
<body>
<header>
  <h1>Sector map — broad buckets over the structural leaf map</h1>
  <div class="note" id="meta">loading…</div>
  <div class="caveat" id="cav"></div>
</header>
<div id="wrap">
  <div id="plot"></div>
  <div id="legend"></div>
</div>
<div id="tip"></div>
<div id="here"><b>Hover a sector button below</b> to light up its region and
constellation. Hover any dot for the leaf itself.</div>
<script>
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

Promise.all([
  fetch("../build/leafmap_effect.json").then(r=>r.json()),
  fetch("../build/sectors.json").then(r=>r.json()),
  fetch("../build/branches.json").then(r=>r.json()),
]).then(([M, S, BR]) => {
  const secOf = S.leaf_sectors;
  const colOf = {}, byName = {};
  S.sectors.forEach(s => { colOf[s.name] = s.color; byName[s.name] = s; });
  const strayOf = {};
  S.sectors.forEach(s => s.strays.forEach(
    l => (strayOf[l] = strayOf[l] || []).push(s.name)));
  const branchOf = BR.leaf_branches || {};
  const nUnbranched = M.n_leaves - Object.keys(secOf).length
                    - S.unsectored_leaves.length;

  document.getElementById("meta").innerHTML =
    `<b>${S.sectors.length}</b> sectors over <b>${M.n_leaves}</b> leaves · ` +
    `positions from the effect-flavoured map (seed ${M.params.random_seed}, ` +
    `umap-learn ${M.params.umap_learn}) · ` +
    `<b>${Object.keys(secOf).length}</b> in ≥1 sector, ` +
    `<b>${S.unsectored_leaves.length}</b> in a branch but no sector, ` +
    `<b>${nUnbranched}</b> unbranched · <a href="sectors.md">notes</a>`;

  document.getElementById("cav").innerHTML =
    `<b>Sectors overlap heavily, so only one lights at a time.</b> ` +
    `Up to <b>7</b> sectors stack at a single point and only <b>32.6%</b> of the ` +
    `covered area carries just one, so eight simultaneous hues could not be ` +
    `read — <b>hover a sector button</b> below to outline that one. Lines are a ` +
    `minimum spanning tree within each sector (long edges cut, so ` +
    `separate clumps are not joined across the map). Dot colour is the leaf's ` +
    `<i>smallest</i> sector, since 38 leaves sit in several. Borders are ` +
    `approximate: a region hugs each clump of its leaves. Read proximity, not ` +
    `distance — this map preserves neighbourhoods, not absolute separations.`;

  // one shared transform: dots and polygons are in the same coordinate space
  const host = document.getElementById("plot");
  const W = host.clientWidth || 1200, H = 660, PAD = 30;
  const xs = M.leaves.map(l=>l.x), ys = M.leaves.map(l=>l.y);
  for (const s of S.sectors) for (const p of s.polygons) for (const q of p) {
    xs.push(q[0]); ys.push(q[1]);
  }
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const sx = v => PAD + (v-x0)/((x1-x0)||1) * (W-2*PAD);
  const sy = v => PAD + (1-(v-y0)/((y1-y0)||1)) * (H-2*PAD);
  const maxN = Math.max(...M.leaves.map(l=>l.n_cards));
  const rad = n => 3 + 11 * Math.sqrt(n/maxN);

  // 38 leaves sit in more than one sector, so a dot's default colour needs a
  // tiebreak. The SMALLEST sector wins: the more specific label is the more
  // informative one, and it is deterministic rather than "whichever came
  // first". Leaves with no sector stay grey.
  const primaryOf = leaf => {
    const secs = secOf[String(leaf)] || [];
    if (!secs.length) return null;
    return secs.slice().sort((a,b) => byName[a].n_leaves - byName[b].n_leaves)[0];
  };
  const baseTone = leaf => {
    const p = primaryOf(leaf);
    return p ? colOf[p] : "#c4c4bf";
  };

  const posOf = {};
  M.leaves.forEach(l => posOf[l.leaf] = [sx(l.x), sy(l.y)]);

  // biggest blob wins the label
  let svg = `<svg width="${W}" height="${H}">`;
  // constellation edges first, so dots sit on top of their own lines
  for (const s of S.sectors) {
    const segs = (s.edges || []).map(([a,b]) => {
      const p = posOf[a], q = posOf[b];
      if (!p || !q) return "";
      return `<line x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" ` +
             `x2="${q[0].toFixed(1)}" y2="${q[1].toFixed(1)}" class="link"></line>`;
    }).join("");
    svg += `<g class="lg-edges" data-s="${esc(s.name)}" ` +
           `style="--hue:${s.color}">${segs}</g>`;
  }
  for (const s of S.sectors.slice().sort((a,b)=>b.n_leaves-a.n_leaves)) {
    const paths = s.polygons.map(p =>
      `<path d="M${p.map(q=>`${sx(q[0]).toFixed(1)},${sy(q[1]).toFixed(1)}`)
        .join("L")}Z"></path>`).join("");
    let lx=0, ly=0;
    if (s.polygons.length) {
      const big = s.polygons.reduce((a,b)=>b.length>a.length?b:a);
      lx = big.reduce((t,q)=>t+sx(q[0]),0)/big.length;
      ly = big.reduce((t,q)=>t+sy(q[1]),0)/big.length;
    }
    svg += `<g class="sect" data-s="${esc(s.name)}" style="--hue:${s.color}">` +
           `${paths}<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" ` +
           `text-anchor="middle">${esc(s.name)}</text></g>`;
  }
  for (let i=0;i<M.leaves.length;i++) {
    const l = M.leaves[i];
    const secs = secOf[String(l.leaf)] || [];
    const stray = (strayOf[l.leaf] || []).length > 0;
    const tone = baseTone(l.leaf);
    svg += `<circle class="leaf${stray?" stray":""}" data-i="${i}" ` +
           `cx="${sx(l.x).toFixed(1)}" cy="${sy(l.y).toFixed(1)}" ` +
           `r="${rad(l.n_cards).toFixed(1)}" ` +
           `fill="${stray?"#fff":tone}" stroke="${stray?tone:"#fff"}"></circle>`;
  }
  host.innerHTML = svg + `</svg>`;

  // Nudge colliding sector labels apart vertically. Several sectors have
  // their largest blob in the same crowded part of the map, so centroid
  // placement alone overlapped "Card Selection & Attrition" with "Removal".
  (() => {
    const labels = [...host.querySelectorAll("g.sect text")];
    for (let pass = 0; pass < 24; pass++) {
      let moved = false;
      for (let i = 0; i < labels.length; i++) {
        for (let j = i + 1; j < labels.length; j++) {
          const a = labels[i].getBBox(), b = labels[j].getBBox();
          const ox = Math.min(a.x+a.width, b.x+b.width) - Math.max(a.x, b.x);
          const oy = Math.min(a.y+a.height, b.y+b.height) - Math.max(a.y, b.y);
          if (ox > 0 && oy > 2) {
            const push = (oy / 2) + 1.5;
            const ay = +labels[i].getAttribute("y"), by = +labels[j].getAttribute("y");
            const up = ay <= by ? labels[i] : labels[j];
            const dn = ay <= by ? labels[j] : labels[i];
            up.setAttribute("y", (+up.getAttribute("y") - push).toFixed(1));
            dn.setAttribute("y", (+dn.getAttribute("y") + push).toFixed(1));
            moved = true;
          }
        }
      }
      if (!moved) break;
    }
  })();

  const groups = [...host.querySelectorAll("g.sect")];
  const edgeGroups = [...host.querySelectorAll("g.lg-edges")];
  const dots = [...host.querySelectorAll("circle.leaf")];
  const lg = document.getElementById("legend");
  const here = document.getElementById("here");

  // branch -> its one parent sector (every branch belongs to exactly one
  // sector in SECTORS, by construction) and branch -> full record, for the
  // dropdown rows and for colouring a branch's leaves by its sector's hue.
  const branchByName = {};
  (BR.branches || []).forEach(b => branchByName[b.name] = b);
  const parentSectorOfBranch = {};
  S.sectors.forEach(s => s.branches.forEach(bn => parentSectorOfBranch[bn] = s.name));
  const branchLeaves = bn => new Set((branchByName[bn] || {}).leaves || []);
  const noSectorLeaves = new Set(
    M.leaves.map(l => l.leaf).filter(l => !(String(l) in secOf)));

  // Checkbox selections persist; hovering a row or a header is a transient
  // preview layered on top, restored to the selection on mouseleave.
  const selectedBranches = new Set();

  lg.innerHTML = S.sectors.map(s => `
    <div class="lg" data-s="${esc(s.name)}" style="--hue:${s.color}">
      <button class="lg-head" data-s="${esc(s.name)}" type="button">
        <span class="sw" style="background:${s.color}"></span>${esc(s.name)}
        <span class="chev">▸</span>
        <small>tier ${s.tier} · ${s.n_leaves} leaves · ` +
        `${s.n_cards.toLocaleString()} cards · ${s.branches.length} branches</small>
      </button>
      <div class="lg-branches" hidden>${s.branches.map(bn => {
        const b = branchByName[bn] || { n_leaves: 0, n_cards: 0 };
        return `<label class="br-row" data-b="${esc(bn)}">` +
          `<input type="checkbox" data-b="${esc(bn)}">` +
          `<span class="br-name">${esc(bn)}</span>` +
          `<span class="br-meta">${b.n_leaves} lv · ${b.n_cards.toLocaleString()} cd</span>` +
          `</label>`;
      }).join("")}</div>
    </div>`).join("") +
    `<button class="lg-plain" data-s="__none"><span class="sw" ` +
    `style="background:#9a9a96"></span>no sector<small>in a branch but ` +
    `unsectored (${S.unsectored_leaves.length}), or unbranched ` +
    `(${nUnbranched})</small></button>`;

  // --- applying a highlight state to the map -------------------------------
  // A state is null (fully neutral: every dot its own default colour, nothing
  // muted, no regions lit) or { sectors, leafFilter, colorForLeaf, label }.
  // `sectors` drives which regions/constellations light up. `leafFilter`, when
  // given, narrows which dots count as "on" to a specific branch (or several);
  // omitted, "on" means "belongs to one of `sectors`" -- that is how a bare
  // sector hover still lights its whole membership.
  function applyState(state) {
    const secOn = new Set(state ? state.sectors : []);
    const any = !!state;
    groups.forEach(g => {
      g.classList.toggle("hot", secOn.has(g.dataset.s));
      g.classList.toggle("mute", any && !secOn.has(g.dataset.s));
    });
    edgeGroups.forEach(g => {
      g.classList.toggle("hot", secOn.has(g.dataset.s));
      g.classList.toggle("mute", any && !secOn.has(g.dataset.s));
    });
    dots.forEach(c => {
      const l = M.leaves[+c.dataset.i];
      const secs = secOf[String(l.leaf)] || [];
      let on, tone;
      if (!state) {
        on = true; tone = baseTone(l.leaf);
      } else if (state.leafFilter) {
        on = state.leafFilter.has(l.leaf);
        tone = on ? state.colorForLeaf(l.leaf) : baseTone(l.leaf);
      } else {
        const hit = secs.find(n => secOn.has(n));
        on = !!hit;
        tone = on ? colOf[hit] : baseTone(l.leaf);
      }
      c.classList.toggle("mute", any && !on);
      const stray = (strayOf[l.leaf] || []).length > 0;
      c.setAttribute("fill", stray ? "#fff" : tone);
      c.setAttribute("stroke", stray ? tone : "#fff");
    });
    lg.querySelectorAll(".lg-head, .lg-plain").forEach(b =>
      b.classList.toggle("on", secOn.has(b.dataset.s)
        || (b.dataset.s === "__none" && state && state.leafFilter === noSectorLeaves)));
    here.innerHTML = state ? state.label : emptyMessage();
  }

  function emptyMessage() {
    return `<span class="empty">Hover a sector or a branch row to preview it. ` +
      `Check a branch's box to pin it — <b>${selectedBranches.size}</b> pinned ` +
      `right now. Grey dots belong to no sector (${S.unsectored_leaves.length} ` +
      `in a branch but unsectored, ${nUnbranched} unbranched).</span>`;
  }

  function sectorState(name) {
    const s = byName[name];
    return { sectors: [name], leafFilter: null, colorForLeaf: null,
      label: `<b>Sector:</b> <span class="chip" style="background:${s.color}">` +
        `${esc(name)}</span><div class="note" style="margin-top:2px">` +
        `${esc(name)} (tier ${s.tier}) — ${esc(s.branches.join(", "))}</div>` };
  }

  function noneState() {
    return { sectors: [], leafFilter: noSectorLeaves, colorForLeaf: () => "#9a9a96",
      label: `<b>No sector.</b> ${S.unsectored_leaves.length} leaves are in a ` +
        `branch but unsectored (see sectors.md for why); ${nUnbranched} more ` +
        `have no branch at all.` };
  }

  function branchState(bn) {
    const sName = parentSectorOfBranch[bn], s = byName[sName], b = branchByName[bn];
    return { sectors: [sName], leafFilter: branchLeaves(bn),
      colorForLeaf: () => s.color,
      label: `<b>Branch:</b> <span class="chip" style="background:${s.color}">` +
        `${esc(bn)}</span><div class="note" style="margin-top:2px">` +
        `${b.n_leaves} leaves · ${b.n_cards.toLocaleString()} cards · part of ` +
        `<b>${esc(sName)}</b></div>` };
  }

  // Checked branches persist across hovers -- this is what "selected" means.
  // Several can be pinned at once, even across different sectors; each leaf
  // is coloured by whichever selected branch is smallest (most specific),
  // same tiebreak reasoning as the default per-dot colour.
  function persistedState() {
    if (!selectedBranches.size) return null;
    const sectors = new Set(), leafFilter = new Set(), owner = {};
    selectedBranches.forEach(bn => {
      const sName = parentSectorOfBranch[bn];
      sectors.add(sName);
      branchLeaves(bn).forEach(lf => {
        leafFilter.add(lf);
        if (!(lf in owner) ||
            branchByName[bn].n_leaves < branchByName[owner[lf]].n_leaves) {
          owner[lf] = bn;
        }
      });
    });
    const names = [...selectedBranches];
    return {
      sectors: [...sectors], leafFilter,
      colorForLeaf: lf => byName[parentSectorOfBranch[owner[lf]]].color,
      label: `<b>${names.length} branch${names.length>1?"es":""} pinned:</b> ` +
        names.map(bn => `<span class="chip" style="background:${
          byName[parentSectorOfBranch[bn]].color}">${esc(bn)}</span>`).join(""),
    };
  }
  const restore = () => applyState(persistedState());

  // --- wiring ---------------------------------------------------------------
  restore();   // paints the initial "0 pinned" neutral state via applyState(null)

  lg.querySelectorAll(".lg").forEach(div => {
    const sName = div.dataset.s;
    const branchesEl = div.querySelector(".lg-branches");

    // Opens on HOVER of the whole box (header + branch list together), not on
    // click. mouseenter/mouseleave are bound to `div`, not `head`, specifically
    // because those events don't re-fire when the pointer moves between a
    // parent and its descendants -- binding them to `head` alone would close
    // the dropdown the moment the cursor crossed from the header down into
    // its own branch rows.
    const openDrop = () => {
      div.classList.add("open");
      branchesEl.hidden = false;
      applyState(sectorState(sName));
    };
    const closeDrop = () => {
      div.classList.remove("open");
      branchesEl.hidden = true;
      restore();
    };
    div.onmouseenter = openDrop;
    div.onmouseleave = closeDrop;
    // keyboard equivalent: focusin/focusout bubble and report whether focus
    // is still somewhere inside the container, unlike plain focus/blur, which
    // would fire (and wrongly close the dropdown) on every Tab between rows
    div.addEventListener("focusin", openDrop);
    div.addEventListener("focusout", e => {
      if (!div.contains(e.relatedTarget)) closeDrop();
    });

    div.querySelectorAll(".br-row").forEach(row => {
      const bn = row.dataset.b;
      const cb = row.querySelector("input");
      row.onmouseenter = () => applyState(branchState(bn));
      // leaving a row (but not the box) falls back to the sector-wide preview,
      // not all the way to the persisted state -- the pointer is still inside
      // this sector's dropdown, so that box's own colour should stay shown
      row.onmouseleave = () => applyState(sectorState(sName));
      cb.onchange = () => {
        if (cb.checked) selectedBranches.add(bn); else selectedBranches.delete(bn);
        row.classList.toggle("checked", cb.checked);
        div.classList.toggle("has-selected",
          [...div.querySelectorAll(".br-row input")].some(x => x.checked));
        restore();
      };
    });
  });

  const noneBtn = lg.querySelector(".lg-plain");
  noneBtn.onmouseenter = () => applyState(noneState());
  noneBtn.onmouseleave = restore;
  noneBtn.onfocus = () => applyState(noneState());
  noneBtn.onblur = restore;

  const tip = document.getElementById("tip");
  dots.forEach(c => {
    const l = M.leaves[+c.dataset.i];
    const secs = secOf[String(l.leaf)] || [];
    const brs = branchOf[String(l.leaf)] || [];
    const stray = strayOf[l.leaf] || [];
    c.onmousemove = ev => {
      tip.style.display = "block";
      tip.style.left = Math.min(ev.clientX+14, innerWidth-450)+"px";
      tip.style.top = (ev.clientY+16)+"px";
      tip.innerHTML =
        `<b>leaf ${l.leaf}</b> · ${l.n_cards} cards<br>` +
        (secs.length
          ? secs.map(n=>`<span class="chip" style="background:${colOf[n]}">` +
              `${esc(n)}</span>`).join("")
          : `<span class="none">no sector</span>`) +
        (stray.length ? `<br><span class="none">outside the drawn shape of: ` +
          `${stray.map(esc).join(", ")}</span>` : "") +
        `<br><span class="cards">branches: ` +
        `${brs.length ? brs.map(esc).join(", ") : "none"}</span>` +
        `<span class="lab">${esc(l.label)}</span>` +
        `<span class="cards">${l.sample.map(esc).join(", ")}` +
        `${l.n_cards>l.sample.length?", …":""}</span>`;
    };
    c.onmouseleave = () => { tip.style.display = "none"; };
  });
}).catch(e => {
  document.getElementById("meta").innerHTML =
    `<b style="color:#b3261e">Load failed: ${esc(e.message)}</b> — run ` +
    `<code>python src/build_sectors.py</code>, and serve over HTTP.`;
});
</script>
</body>
</html>
